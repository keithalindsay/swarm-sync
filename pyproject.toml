[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-sync"
version = "0.1.0"
description = "Stigmergic lease fabric so many AI coding agents can edit one codebase concurrently without colliding (Pheromesh architecture)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Keith Lindsay" }]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "multi-agent",
    "coordination",
    "stigmergy",
    "claude-code",
    "code-analysis",
    "distributed-locking",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Deliberately dependency-light so the build is reproducible.
# Classifier uses the stdlib `ast` module (no tree-sitter needed for the Python target).
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",       # thin agent client + FastAPI TestClient
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/keithalindsay/swarm-sync"
Repository = "https://github.com/keithalindsay/swarm-sync"
Documentation = "https://github.com/keithalindsay/swarm-sync/blob/master/README.md"
Architecture = "https://github.com/keithalindsay/swarm-sync/blob/master/ARCHITECTURE.md"
Design = "https://github.com/keithalindsay/swarm-sync/blob/master/docs/DESIGN.md"
Issues = "https://github.com/keithalindsay/swarm-sync/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
# WP4.2: `swarm-sync` is an ALIAS of `swarmsync-serve` -- ONE launcher, one set
# of defaults (port 8787, swarmsync.db, --root/--fresh, banner, clock check).
swarm-sync = "swarmsync.server.serve:main"
swarmsync = "swarmsync.cli:main"  # WP5.1: operator/agent CLI (status/holds/free/events)
swarmsync-hook = "swarmsync.hooks.adapter:main"
swarmsync-serve = "swarmsync.server.serve:main"

[tool.setuptools.packages.find]
include = ["swarmsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["swarmsync"]
ignore_missing_imports = true
warn_unused_ignores = true
